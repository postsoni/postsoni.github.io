<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせ - ぽすとそに工房</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            max-width: 100%;
        }
        
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 50%, #ffd89b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .form-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            border: 3px solid #ff9a76;
        }
        
        .language-switcher {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .lang-btn {
            padding: 8px 15px;
            background: #f5f5f5;
            border: 2px solid transparent;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Zen Maru Gothic', sans-serif;
        }

        .lang-btn:hover {
            background: #ff9a76;
            color: white;
        }

        .lang-btn.active {
            background: linear-gradient(135deg, #ff9a76 0%, #ff6b9d 100%);
            color: white;
            border-color: #ff6b9d;
        }
        
        h1 {
            font-size: 32px;
            color: #ff6b6b;
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px dashed #ffd4c4;
            padding-bottom: 15px;
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        label {
            display: block;
            font-size: 18px;
            color: #ff6b6b;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 12px 15px;
            font-size: 16px;
            border: 2px solid #ffd4c4;
            border-radius: 8px;
            font-family: 'Zen Maru Gothic', sans-serif;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        textarea:focus {
            outline: none;
            border-color: #ff9a76;
        }
        
        textarea {
            min-height: 200px;
            resize: vertical;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Zen Maru Gothic', sans-serif;
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #ff9a76 0%, #ff6b6b 100%);
            color: white;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .cancel-btn {
            background: #e0e0e0;
            color: #666;
        }
        
        .cancel-btn:hover {
            background: #d0d0d0;
            transform: translateY(-2px);
        }
        
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 600;
            display: none;
        }
        
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 2px solid #c3e6cb;
        }
        
        .alert.error {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }
        
        .error-text {
            color: #ff6b6b;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        
        /* 相談テンプレート */
        .template-hint {
            background: #fff7f2;
            border: 2px dashed #ffd4c4;
            border-radius: 10px;
            padding: 15px 18px;
            margin-bottom: 12px;
            font-size: 15px;
            color: #555;
            line-height: 1.7;
        }

        .template-hint ul {
            margin: 6px 0 0 1.2em;
        }

        .template-btn {
            flex: none;
            display: inline-block;
            padding: 8px 18px;
            font-size: 15px;
            font-weight: 600;
            background: #fff;
            color: #ff6b6b;
            border: 2px solid #ff9a76;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .template-btn:hover {
            background: #ff9a76;
            color: #fff;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 25px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <!-- 言語切り替えボタン -->
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="ja">🇯🇵 日本語</button>
            <button class="lang-btn" data-lang="en">🇬🇧 English</button>
            <button class="lang-btn" data-lang="zh">🇨🇳 中文</button>
        </div>

        <h1 id="formTitle">📧 お問い合わせフォーム</h1>
        
        <div id="alertBox" class="alert"></div>
        
        <form id="contactForm">
            <div class="form-group">
                <label for="from_name" id="nameLabel">ハンドルネーム *</label>
                <input type="text" id="from_name" name="from_name" required>
                <p class="error-text" id="nameError">ハンドルネームを入力してください</p>
            </div>
            
            <div class="form-group">
                <label for="user_email" id="emailLabel">メールアドレス *</label>
                <input type="email" id="user_email" name="user_email" required>
                <p class="error-text" id="emailError">有効なメールアドレスを入力してください</p>
            </div>
            
            <div class="form-group">
                <label for="user_message" id="messageLabel">お問い合わせ内容 *</label>
                <div class="template-hint">
                    <span id="templateHintTitle">ご相談の場合は、次のことを書いていただけると早く正確にお答えできます。</span>
                    <ul id="templateHintList">
                        <li>機体・機種名</li>
                        <li>送信機・受信機（分かればファームウェアのバージョンも）</li>
                        <li>症状・困っていること</li>
                        <li>いつから・きっかけ</li>
                        <li>試したこと</li>
                        <li>写真・動画の有無</li>
                    </ul>
                </div>
                <button type="button" class="template-btn" id="templateBtn" onclick="insertTemplate()">📝 相談テンプレートを入れる</button>
                <textarea id="user_message" name="message" required></textarea>
                <p class="error-text" id="messageError">お問い合わせ内容を入力してください</p>
            </div>
            
            <div class="button-group">
                <button type="submit" class="submit-btn" id="submitBtn">送信</button>
                <button type="button" class="cancel-btn" id="cancelBtn" onclick="closeWindow()">キャンセル</button>
            </div>
        </form>
    </div>
    
    <!-- EmailJS SDK -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        // 翻訳データ
        const translations = {
            ja: {
                title: '📧 お問い合わせフォーム',
                nameLabel: 'ハンドルネーム *',
                emailLabel: 'メールアドレス *',
                messageLabel: 'お問い合わせ内容 *',
                submitBtn: '送信',
                submitBtnSending: '送信中...',
                cancelBtn: 'キャンセル',
                nameError: 'ハンドルネームを入力してください',
                emailError: '有効なメールアドレスを入力してください',
                messageError: 'お問い合わせ内容を入力してください',
                successMessage: '✅ お問い合わせを送信しました！ご連絡ありがとうございます。',
                errorMessage: '❌ 送信に失敗しました。もう一度お試しください。エラー: ',
                cancelConfirm: 'お問い合わせをキャンセルしてタブを閉じますか？',
                templateHintTitle: 'ご相談の場合は、次のことを書いていただけると早く正確にお答えできます。',
                templateHintList: ['機体・機種名', '送信機・受信機（分かればファームウェアのバージョンも）', '症状・困っていること', 'いつから・きっかけ', '試したこと', '写真・動画の有無'],
                templateBtn: '📝 相談テンプレートを入れる',
                template: '【機体・機種名】\n\n【送信機・受信機】（例：TX16S／ER8　分かればEdgeTX・ELRS・Rotorflightなどのバージョンも）\n\n【症状・困っていること】\n\n【いつから・きっかけ】（墜落後、設定変更後、買ったときから など）\n\n【試したこと】\n\n【写真・動画】あり／なし（ある場合は、こちらからの返信メールに添付してください）\n'
            },
            en: {
                title: '📧 Contact Form',
                nameLabel: 'Name *',
                emailLabel: 'Email Address *',
                messageLabel: 'Message *',
                submitBtn: 'Send',
                submitBtnSending: 'Sending...',
                cancelBtn: 'Cancel',
                nameError: 'Please enter your name',
                emailError: 'Please enter a valid email address',
                messageError: 'Please enter your message',
                successMessage: '✅ Your message has been sent! Thank you for contacting us.',
                errorMessage: '❌ Failed to send. Please try again. Error: ',
                cancelConfirm: 'Cancel the inquiry and close the tab?',
                templateHintTitle: 'For consultations, including the following helps us answer faster and more accurately.',
                templateHintList: ['Model / kit name', 'Transmitter and receiver (firmware versions if known)', 'Symptoms / what you need help with', 'When it started / what triggered it', 'What you have already tried', 'Whether you have photos or videos'],
                templateBtn: '📝 Insert consultation template',
                template: '[Model / kit name]\n\n[Transmitter / receiver] (e.g. TX16S / ER8, plus EdgeTX, ELRS or Rotorflight versions if known)\n\n[Symptoms / what you need help with]\n\n[When it started / trigger] (after a crash, after a settings change, since purchase, etc.)\n\n[What you have tried]\n\n[Photos / videos] Yes / No (if yes, please attach them to our reply email)\n'
            },
            zh: {
                title: '📧 联系表单',
                nameLabel: '姓名 *',
                emailLabel: '电子邮箱 *',
                messageLabel: '咨询内容 *',
                submitBtn: '发送',
                submitBtnSending: '发送中...',
                cancelBtn: '取消',
                nameError: '请输入姓名',
                emailError: '请输入有效的电子邮箱',
                messageError: '请输入咨询内容',
                successMessage: '✅ 您的消息已发送！感谢您的联系。',
                errorMessage: '❌ 发送失败。请重试。错误：',
                cancelConfirm: '取消咨询并关闭标签页？',
                templateHintTitle: '如需咨询，请尽量填写以下内容，以便我们更快、更准确地回复。',
                templateHintList: ['机型名称', '遥控器・接收机（如知道，请注明固件版本）', '症状・遇到的问题', '何时开始・起因', '已尝试的方法', '是否有照片・视频'],
                templateBtn: '📝 插入咨询模板',
                template: '【机型名称】\n\n【遥控器・接收机】（例：TX16S／ER8，如知道请注明 EdgeTX・ELRS・Rotorflight 等版本）\n\n【症状・遇到的问题】\n\n【何时开始・起因】（坠机后、更改设置后、购买时起 等）\n\n【已尝试的方法】\n\n【照片・视频】有／无（如有，请附在我们的回复邮件中）\n'
            }
        };

        // 現在の言語
        let currentLang = 'ja';

        // EmailJS初期化
        (function() {
            emailjs.init("C2FrybtHNcX163rHk");
        })();
        
        const form = document.getElementById('contactForm');
        const submitBtn = document.getElementById('submitBtn');
        const alertBox = document.getElementById('alertBox');
        
        // URLパラメータから言語を取得
        function getLanguageFromURL() {
            const params = new URLSearchParams(window.location.search);
            const lang = params.get('lang');
            return lang && translations[lang] ? lang : 'ja';
        }

        // 言語設定
        function setLanguage(lang) {
            currentLang = lang;
            const trans = translations[lang];

            // テキストを更新
            document.getElementById('formTitle').textContent = trans.title;
            document.getElementById('nameLabel').textContent = trans.nameLabel;
            document.getElementById('emailLabel').textContent = trans.emailLabel;
            document.getElementById('messageLabel').textContent = trans.messageLabel;
            document.getElementById('submitBtn').textContent = trans.submitBtn;
            document.getElementById('cancelBtn').textContent = trans.cancelBtn;
            document.getElementById('nameError').textContent = trans.nameError;
            document.getElementById('emailError').textContent = trans.emailError;
            document.getElementById('messageError').textContent = trans.messageError;
            document.getElementById('templateHintTitle').textContent = trans.templateHintTitle;
            document.getElementById('templateBtn').textContent = trans.templateBtn;
            const hintList = document.getElementById('templateHintList');
            hintList.innerHTML = '';
            trans.templateHintList.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item;
                hintList.appendChild(li);
            });

            // ボタンのアクティブ状態を更新
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.getAttribute('data-lang') === lang) {
                    btn.classList.add('active');
                }
            });

            // localStorageに保存
            localStorage.setItem('language', lang);
        }

        // 言語切り替えボタンのイベント
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const lang = this.getAttribute('data-lang');
                setLanguage(lang);
            });
        });

        // 初期言語設定（URLパラメータ → localStorage → デフォルト）
        const urlLang = getLanguageFromURL();
        const savedLang = localStorage.getItem('language');
        const initialLang = urlLang || savedLang || 'ja';
        setLanguage(initialLang);
        
        // フォーム送信
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            console.log('フォーム送信開始');
            
            // バリデーション
            if (!validateForm()) {
                console.log('バリデーションエラー');
                return;
            }
            
            // ボタン無効化
            const trans = translations[currentLang];
            submitBtn.disabled = true;
            submitBtn.textContent = trans.submitBtnSending;
            
            console.log('EmailJS送信開始');
            
            // EmailJS送信
            emailjs.sendForm('service_dy4kkhw', 'template_67kxcmc', form)
                .then(function(response) {
                    console.log('送信成功!', response.status, response.text);
                    showAlert('success', trans.successMessage);
                    form.reset();
                    
                    // 3秒後にタブを閉じる
                    setTimeout(function() {
                        window.close();
                    }, 3000);
                }, function(error) {
                    console.log('送信失敗...', error);
                    showAlert('error', trans.errorMessage + JSON.stringify(error));
                    submitBtn.disabled = false;
                    submitBtn.textContent = trans.submitBtn;
                });
        });
        
        // バリデーション
        function validateForm() {
            let isValid = true;
            const trans = translations[currentLang];
            
            const name = document.getElementById('from_name').value.trim();
            const email = document.getElementById('user_email').value.trim();
            const message = document.getElementById('user_message').value.trim();
            
            // エラーメッセージリセット
            document.querySelectorAll('.error-text').forEach(el => el.style.display = 'none');
            
            if (name === '') {
                document.getElementById('nameError').textContent = trans.nameError;
                document.getElementById('nameError').style.display = 'block';
                isValid = false;
            }
            
            if (email === '' || !isValidEmail(email)) {
                document.getElementById('emailError').textContent = trans.emailError;
                document.getElementById('emailError').style.display = 'block';
                isValid = false;
            }
            
            if (message === '') {
                document.getElementById('messageError').textContent = trans.messageError;
                document.getElementById('messageError').style.display = 'block';
                isValid = false;
            }
            
            return isValid;
        }
        
        // メールアドレス検証
        function isValidEmail(email) {
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return re.test(email);
        }
        
        // アラート表示
        function showAlert(type, text) {
            alertBox.className = 'alert ' + type;
            alertBox.textContent = text;
            alertBox.style.display = 'block';
        }
        
        // 相談テンプレートを入れる（入力済みの文章は消さず、後ろに足す）
        function insertTemplate() {
            const textarea = document.getElementById('user_message');
            const template = translations[currentLang].template;
            const current = textarea.value.trim();
            textarea.value = current === '' ? template : current + '\n\n' + template;
            textarea.focus();
            textarea.setSelectionRange(0, 0);
            textarea.scrollTop = 0;
        }

        // キャンセル（タブを閉じる）
        function closeWindow() {
            const trans = translations[currentLang];
            if (confirm(trans.cancelConfirm)) {
                window.close();
            }
        }
    </script>
</body>
</html>
